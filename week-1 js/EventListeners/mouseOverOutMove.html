<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        border: 0;
        font-family: "Gilroy";
      }
      body,
      html {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
        
      }
      .container {
        width: 300px;
        height: 300px;
        background-color: rgb(97, 232, 232);
        display: flex;
        justify-content: center;
        align-items: center;
        position: absolute;
        transition:all cubic-bezier(0.19, 1, 0.22, 1) 0.3s;
      }
    </style>
  </head>
  <body>
    <div class="container">Hey</div>
    <script>
      let div = document.querySelector("div");
      div.addEventListener(
        "mouseover",
        () => (div.style.backgroundColor = "blue"),
      );

      div.addEventListener(
        "mouseout",
        () => (div.style.backgroundColor = "rgb(97, 232, 232)"),
      );

      window.addEventListener("mousemove", (val) => {
        div.style.top = val.clientY + "px";
        div.style.left = val.clientX + "px";
      });
    </script>
  </body>
</html>
