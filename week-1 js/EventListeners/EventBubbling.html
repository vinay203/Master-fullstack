<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Event Bubbling</title>
    <style>
      * {
        margin: 0;
        border: 0;
        padding: 0;
        font-family: "Montserrat";
        background-color: rgb(127, 124, 124);
      }
      body,
      html {
        width: 100%;
        height: 100%;
      }
      div{
        padding:50px;
      }
      .lt{
        text-decoration: line-through;
      }
    </style>
  </head>
  <body>
    <div>
      <ul >
        <li>apples</li>
        <li>grapes</li>
        <li>pinapple</li>
        <li>orange</li>
        <li>guava</li>
      </ul>
    </div>
    <script>
        let ul = document.querySelector("ul");
        ul.addEventListener("click", (e) => {
            e.target.classList.toggle("lt")
        })
    </script>
  </body>
</html>
