<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        border: 0;
        box-sizing: border-box;
      }
      body,
      html {
        height: 100%;
        width: 100%;
        background-color: rgb(96, 97, 97);
      }
      input::placeholder,
      textarea::placeholder {
        font-size: 14px;
        font-weight: 800;
        opacity: 1;
        font-family: Poppins, sans-serif;
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .forms {
        width: 400px;
        height: 400px;
        margin-right: 20px;
        border-radius: 20px;
        box-shadow: 5px 5px 10px black;
        padding: 20px;
        flex-shrink: 0;
      }
      .container {
        display: flex;
        height: 100vh;
        align-items: center;
        padding: 40px;
        justify-content: center;
      }

      .cards-container {
        display: flex;
        flex-direction: row;
        align-items: center;
        gap: 40px;
        overflow-x: auto;
        height: 100%;
        padding: 40px;
        scroll-behavior: smooth;
        padding-left: 20px;
      }

      .cards-container::-webkit-scrollbar {
        display: none;
      }

      input {
        padding: 10px;
        border-radius: 10px;
        outline: none;
        margin-bottom: 5px;
      }
      .textarea {
        width: 100%;
        height: 70px;
        resize: none;
        padding: 10px;
        border-radius: 10px;
        outline: none;
        margin-bottom: 5px;
      }

      .card {
        padding: 20px;
        width: 420px;
        height: 400px;
        border-radius: 20px;
        box-shadow: 5px 5px 10px black;
        flex-shrink: 0;
      }
      .profile {
        border-radius: 10px;
        width: 120px;
        height: 120px;
        overflow: hidden;
        margin-bottom: 20px;
        margin-left: 10px;
        margin-top: 10px;
      }
      .profile img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: top;
      }
      h3 {
        margin: 7px;
        margin-left: 10px;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        color: white;
      }
      .txt {
        overflow: hidden;
        display: -webkit-box;
        -webkit-line-clamp: 3;
        -webkit-box-orient: vertical;
      }
      .container::-webkit-scrollbar {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="forms">
        <form action="">
          <input type="text" placeholder="Profile URL" required />
          <input type="text" placeholder="Name" required />
          <input type="number" min="1" max="100" placeholder="Age" required />
          <input type="text" placeholder="Occupation" required />
          <textarea
            maxlength="200"
            class="textarea"
            placeholder="Write a short bio"
            required
          ></textarea>
          <input type="submit" value="Submit" />
        </form>
      </div>
      <div class="cards-container">
        <!-- <div class="card">
        <div class="profile">
          <img
            class="img"
            src="https://images.unsplash.com/photo-1768777156507-8304c612d621?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHwxMjd8fHxlbnwwfHx8fHw%3D"
            alt="Image"
          />
        </div>
        <h3 class="nm">Rakesh</h3>
        <h3 class="ag">26</h3>
        <h3 class="occ">Student</h3>
        <h3 class="txt">
          Lorem ipsum dolor sit amet consectetur adipisicing elit. Esse,
          adipisci.
        </h3>
      </div> -->
      </div>
    </div>
    <script>
      let form = document.querySelector("form");
      let inp = document.querySelectorAll("input");
      let textArea = document.querySelector("textarea");
      form.addEventListener("submit", (e) => {
        e.preventDefault();

        //document.querySelector(".container").style.justifyContent = "flex-start"

        let card = document.createElement("div");
        card.classList.add("card");

        let profile = document.createElement("div");
        profile.classList.add("profile");

        let img = document.createElement("img");
        img.classList.add("img");

        let name = document.createElement("h3");
        let age = document.createElement("h3");
        let occ = document.createElement("h3");
        let text = document.createElement("h3");
        text.classList.add("txt");

        profile.appendChild(img);
        card.append(profile, name, age, occ, text);
        document.querySelector(".cards-container").appendChild(card);

        inp.forEach((val) => {
          img.src = inp[0].value;
          name.textContent = inp[1].value;
          age.textContent = inp[2].value;
          occ.textContent = inp[3].value;
        });
        text.textContent = textArea.value;
      });
    </script>
  </body>
</html>
