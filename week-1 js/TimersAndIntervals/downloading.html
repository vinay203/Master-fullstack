<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        border: 0;
        font-family: "Satoshi", sans-serif;
        font-size: 20px;
        font-weight: 800;
        box-sizing: border-box;
      }
      body,
      html {
        height: 100%;
        width: 100%;
      }
      body {
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .container {
        width: 400px;
        height: 200px;
        padding: 30px;
        border-radius: 20px;
        display: flex;
        justify-content: center;
        background-color: rgb(193, 189, 189);
        flex-direction: column;
        align-items: center;
      }
      .bar {
        width: 100%;
        height: 20px;
        border-radius: 50px;
        background-color: transparent;
        border: 2px solid rgb(15, 13, 13);
        margin-top: 30px;
        margin-bottom: 20px;
      }
      .fill {
        width: 0%;
        height: 100%;
        border-radius: 50px;
        background-color: rgb(21, 19, 19);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="downloading">Downloading...</div>
      <div class="bar">
        <div class="fill"></div>
      </div>
      <div class="number">0%</div>
    </div>
    <script>
      let count = 0;
      let sint = setInterval(() => {
        if (count <= 99) {
            count++;
          document.querySelector(".fill").style.width = `${count}%`;
          document.querySelector(".number").textContent = `${count}%`;
        }else{
          document.querySelector(".downloading").textContent = "Downloaded";
        }
      }, 40);
    </script>
  </body>
</html>
