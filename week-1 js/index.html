<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <style>
    .high{
      color: darkblue;
    }
  </style>
</head>
<body>
  <div></div>
  <h1>Hey how are you</h1>
  <ul>
    <li>first</li>
    <li>second</li>
    <li>third</li>
    <li>fourth</li>
    <li>fifth</li>
  </ul>
  <script>
    let li = document.querySelectorAll("li")
    li.forEach((ele, i) => {
      if (i % 2 == 1){
        ele.classList.add("high")
      }
    })
  </script>
</body>
</html>
